name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: originpass
          POSTGRES_USER: originpass
          POSTGRES_PASSWORD: originpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U originpass -d originpass"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://originpass:originpass@localhost:5432/originpass
      SECRET_KEY: only-for-continuous-integration
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install -y gettext

      - name: Compile the translations
        # The interface is served in Spanish (UR04) and the tests assert what a
        # visitor reads, so the suite needs the compiled catalogue.
        run: python manage.py compilemessages

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python manage.py migrate

      - name: Run the test suite
        run: python manage.py test --verbosity 2

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .
