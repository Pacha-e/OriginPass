services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: originpass
      POSTGRES_USER: originpass
      POSTGRES_PASSWORD: originpass
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U originpass -d originpass"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
