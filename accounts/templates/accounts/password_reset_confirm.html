{% extends "base.html" %}
{% load i18n %}
{% block title %}{% translate "Choose a new password" %} — OriginPass{% endblock %}
{% block content %}
<div class="page-head">
  <h1>{% translate "Choose a new password" %}</h1>
</div>
<div class="card card--narrow">
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn--primary">{% translate "Change password" %}</button>
  </form>
</div>
{% endblock %}
