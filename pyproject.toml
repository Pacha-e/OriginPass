[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
    "DJ",  # Django-specific checks
    "C4",  # comprehensions
]

[tool.ruff.lint.isort]
known-first-party = ["accounts", "audit", "companies", "config", "products", "verification"]
