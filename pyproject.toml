[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
    "DJ",  # Django-specific checks
    "C4",  # comprehensions
]

[tool.ruff.lint.per-file-ignores]
# Holds the narration and the slide copy of the deliverable video. The long
# lines are Spanish prose, and breaking a sentence to satisfy a column limit
# makes the text harder to read and to edit than leaving it whole.
"video/script.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["accounts", "audit", "companies", "config", "products", "verification"]
